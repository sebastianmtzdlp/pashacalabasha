<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasha Calabasha</title>
  <meta name="description" content="Portafolio fotográfico de Pasha Calabasha.">
  <style>
    :root { --bg:#f4f1ec; --fg:#1b1a18; --muted:#6c675f; }
    @media (prefers-color-scheme: dark) { :root { --bg:#121211; --fg:#f0ece4; --muted:#98938a; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif;
           display: grid; place-items: center; padding: 24px; text-align: center; }
    h1 { font-weight: 400; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: .12em; margin: 0 0 .5rem; text-transform: uppercase; }
    p { color: var(--muted); margin: 0; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main>
    <h1>Pasha Calabasha</h1>
    <p>Fotografía. Portafolio nuevo en camino.</p>
  </main>
</body>
</html>
