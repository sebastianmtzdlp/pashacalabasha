<html lang="es">
<head>

<title>Cascada — Pasha Calabasha</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="description" content="Niebla, roca volcánica y el ruido constante del agua. Coatepec, Veracruz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#f4f1ea; --ink:#17161a; --muted:#77726a; --line:#dcd6c9;
  --moss:#c98a2b; --amber:#c98a2b;
  --gut:clamp(16px,4vw,56px);
  --serif:Newsreader,Georgia,serif; --sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:auto;background:var(--line)}
a{color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:3px}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;color:var(--ink);font-size:.9rem;background:rgba(244,241,234,.88);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(23,22,26,.08);transition:background-color .3s,color .3s,border-color .3s}
/* sobre la portada oscura del inicio la barra es transparente; al bajar se vuelve sólida */
.nav.top{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:transparent;color:#f4f1ea}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav{background:var(--paper)}.nav.top{background:transparent}}
.nav a{text-decoration:none}
.nav nav{display:flex;gap:1.6rem}
.nav a:hover{text-decoration:underline;text-underline-offset:4px}

/* hero */
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden;color:#fff}
.hero img{position:absolute;inset:0;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,8,.62),rgba(10,10,8,0) 55%)}
.hero h1{position:absolute;z-index:2;left:var(--gut);right:var(--gut);bottom:clamp(24px,6vh,64px);margin:0;font:300 clamp(3.2rem,13vw,11rem)/.9 var(--serif);letter-spacing:-.025em}
.hero p{position:absolute;z-index:2;right:var(--gut);bottom:calc(clamp(24px,6vh,64px) + clamp(3.2rem,13vw,11rem) + 14px);margin:0;font-size:.95rem;max-width:22ch;text-align:right}
@media(max-width:620px){.hero p{left:var(--gut);right:auto;text-align:left}}

/* intro */
.intro{padding:clamp(72px,14vw,200px) var(--gut);display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px}
.intro p{grid-column:4/12;margin:0;font:300 clamp(1.6rem,3.6vw,3rem)/1.25 var(--serif);letter-spacing:-.01em}
.intro p em{color:var(--moss)}
@media(max-width:800px){.intro p{grid-column:1/-1}}

/* series */
.serie{padding-bottom:clamp(72px,12vw,180px)}
.head{padding:0 var(--gut) clamp(24px,4vw,56px);display:grid;grid-template-columns:repeat(12,1fr);gap:8px 24px;align-items:baseline}
.head h2{grid-column:1/8;margin:0;font:300 clamp(2.2rem,6vw,5rem)/1 var(--serif);letter-spacing:-.02em}
.head p{grid-column:8/13;margin:0;color:var(--muted);font-size:.98rem;max-width:42ch}
@media(max-width:800px){.head h2,.head p{grid-column:1/-1}}

figure{margin:0;cursor:zoom-in}
figcaption{padding:10px var(--gut) 0;font-size:.85rem;color:var(--muted)}
.full img{max-height:96svh;object-fit:cover}
.pad{padding:0 var(--gut)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vw,24px);padding:0 var(--gut)}
.duo figcaption{padding-left:0}
.duo.off figure:nth-child(2){margin-top:clamp(40px,10vw,160px)}
.solo{display:grid;grid-template-columns:repeat(12,1fr);padding:0 var(--gut)}
.solo figure{grid-column:4/10}
.solo.l figure{grid-column:1/7}
.solo.r figure{grid-column:7/13}
.solo figcaption{padding-left:0}
.stack>*+*{margin-top:clamp(8px,1.6vw,24px)}
section.serie .stack{display:flex;flex-direction:column;gap:clamp(8px,1.6vw,24px)}
section.serie .stack>*+*{margin-top:0}
.stack{gap:clamp(28px,6vw,96px)!important}
@media(max-width:700px){
  .duo{grid-template-columns:1fr}
  .duo.off figure:nth-child(2){margin-top:0}
  .solo figure,.solo.l figure,.solo.r figure{grid-column:1/-1}
}

/* about + contact */
.about{padding:clamp(64px,10vw,140px) var(--gut);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(12,1fr);gap:32px 24px}
.about h2{grid-column:1/5;margin:0;font:300 clamp(1.8rem,3.4vw,2.8rem)/1.1 var(--serif)}
.about div{grid-column:5/12;grid-row:2;max-width:58ch}
.about .sobre-foto{grid-column:1/5;grid-row:2;margin:0;cursor:zoom-in}
.about .sobre-foto img{aspect-ratio:3/4;object-fit:cover;max-width:320px}
@media(max-width:800px){.about div,.about .sobre-foto{grid-row:auto}.about .sobre-foto{grid-column:1/-1}.about .sobre-foto img{max-width:260px}}
.about p{margin:0 0 1.1em}
.contact{padding:clamp(48px,8vw,120px) var(--gut) 40px;border-top:1px solid var(--line)}
.contact a.big{display:inline-block;font:300 clamp(1.6rem,6vw,5rem)/1.05 var(--serif);letter-spacing:-.02em;text-decoration:none;border-bottom:1px solid currentColor}
.contact a.big:hover{color:var(--moss)}
.contact ul{list-style:none;margin:2rem 0 0;padding:0;display:flex;gap:2rem;flex-wrap:wrap}
footer{padding:0 var(--gut) 32px;color:var(--muted);font-size:.85rem}
@media(max-width:800px){.about h2,.about div{grid-column:1/-1}}


/* familia (privada) */
.lock{padding:0 var(--gut)}
.lock form{display:flex;gap:12px;flex-wrap:wrap;align-items:center;max-width:520px}
.lock input{flex:1 1 220px;font:inherit;padding:.8em 1em;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0}
.lock button{font:500 1rem var(--sans);padding:.85em 1.6em;background:var(--ink);color:var(--paper);border:0;cursor:pointer}
.lock button:disabled{opacity:.5;cursor:wait}
.lock .err{color:#a33a2a;margin:.8em 0 0;min-height:1.6em;font-size:.95rem}
#fam-grid{columns:2;column-gap:clamp(8px,1.6vw,24px);padding:0 var(--gut)}
#fam-grid figure{break-inside:avoid;margin:0 0 clamp(8px,1.6vw,24px)}
@media(max-width:700px){#fam-grid{columns:1}}

/* páginas */
.nav a{white-space:nowrap}
.nav a[aria-current]{text-decoration:underline;text-underline-offset:4px}
@media(max-width:620px){.nav{font-size:.85rem;padding:14px 16px}.nav nav{gap:.9rem}.nav nav .n-sobre,.nav nav a[href="/familia"],.nav nav .n-series{display:none}}
@media(max-width:380px){.nav nav{gap:.7rem}.nav{font-size:.8rem}}
.page{padding-top:clamp(104px,14vw,170px)}
.page>.serie{padding-bottom:clamp(56px,8vw,120px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(28px,3vw,48px) clamp(16px,2vw,32px);padding:0 var(--gut) clamp(72px,12vw,160px)}
.card a{display:block;text-decoration:none}
.card img,.card .priv{aspect-ratio:4/5;object-fit:cover}
.card .priv{display:grid;place-items:center;background:var(--line);color:var(--muted);font:300 1.4rem var(--serif);font-style:italic}
.card h3{margin:14px 0 4px;font:300 clamp(1.6rem,2.6vw,2.2rem)/1.1 var(--serif);letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.card a:hover h3{color:var(--moss)}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.next{display:flex;justify-content:space-between;gap:16px;padding:28px var(--gut) clamp(56px,8vw,110px);border-top:1px solid var(--line)}
.next a{text-decoration:none;font:300 clamp(1.3rem,2.4vw,2rem)/1.2 var(--serif)}
.next a:hover{color:var(--moss)}
.next span{display:block;font:400 .85rem var(--sans);color:var(--muted)}
.next .sig{text-align:right;margin-left:auto}
.page>.about,.page>.contact{border-top:0}

/* fotolibros */
.libros{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(36px,4vw,64px) clamp(16px,2vw,32px);padding:0 var(--gut) clamp(72px,12vw,160px)}
.libro figure{cursor:zoom-in}
.libro img{aspect-ratio:4/5;object-fit:cover}
.libro h3{margin:14px 0 4px;font:300 clamp(1.5rem,2.4vw,2rem)/1.1 var(--serif);letter-spacing:-.01em}
.libro .meta{margin:0 0 8px;color:var(--muted);font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
#cursos .sub{margin:clamp(56px,7vw,96px) 0 0;padding:0 clamp(16px,4.2vw,52px);font:400 clamp(1.2rem,2vw,1.5rem)/1.2 var(--serif)}
#cursos .precio{margin:12px 0 0;font-size:.95rem;color:var(--ink)}
.cursos-cta{padding:clamp(40px,6vw,80px) clamp(16px,4.2vw,52px) clamp(56px,8vw,120px);margin:0}
.cursos-cta a{text-decoration:underline;text-underline-offset:4px}
.libro p{margin:0;max-width:46ch}
.libros .vacio{grid-column:1/-1;margin:0;color:var(--muted);font:300 clamp(1.3rem,2.4vw,1.8rem)/1.3 var(--serif);font-style:italic}
@media(max-width:900px){.libros{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.libros{grid-template-columns:1fr}}

/* lightbox */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100svh;width:100vw;height:100svh}
dialog::backdrop{background:rgba(10,10,8,.94)}
dialog img{position:absolute;inset:0;margin:auto;width:auto;height:auto;max-width:94vw;max-height:92svh;background:none}
dialog button{position:absolute;top:14px;right:18px;background:none;border:0;color:#fff;font:400 1rem var(--sans);cursor:pointer;padding:8px}
dialog .lb-flecha{top:50%;transform:translateY(-50%);font-size:2.4rem;line-height:1;padding:14px 18px}
dialog .lb-ant{left:4px;right:auto}
dialog .lb-sig{right:4px}
dialog .lb-pie{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#d8d3c8;font:400 .9rem var(--sans);margin:0;padding:0 var(--gut)}

/* propuesta: portada, series, sobre mí y contacto en el inicio */
.cover{height:100vh;height:100svh;min-height:520px;position:relative;display:grid;place-items:center;background:#0e0d0c;color:#f4f1ea;overflow:hidden}
.cover img{position:absolute;inset:0;height:100%;object-fit:cover;opacity:.55;background:none}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(42,39,34,.35),rgba(14,13,12,.75))}
.cover h1{position:relative;z-index:2;margin:0;padding:0 var(--gut);font:300 clamp(40px,7vw,96px)/1 var(--serif);letter-spacing:-.02em;text-align:center}
.cover h1 em{color:var(--amber);font-style:italic}
.cover .frame-label,.cover .scroll{position:absolute;z-index:2;bottom:20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d2cbbb;text-decoration:none}
.cover .frame-label{left:24px}
.cover .scroll{right:24px}
@media(max-width:620px){.cover .scroll{display:none}}
.series{padding:120px 28px 40px}
.series>h2,.home-about h2{font:400 clamp(28px,3.6vw,40px)/1.1 var(--serif);margin:0 0 12px}
.series .sub{color:var(--muted);margin:0 0 56px}
.sgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:48px 18px}
.sgrid a{display:block;text-decoration:none;position:relative}
.sgrid img,.sgrid .priv{width:100%;height:auto;object-fit:cover}
.sgrid .priv{display:grid;place-items:center;background:linear-gradient(140deg,#cfc7b6,#8e8777);color:#2b2a27;font:300 1.6rem var(--serif);font-style:italic}
.sgrid h3{margin:12px 0 2px;font:400 clamp(1.4rem,2.2vw,1.9rem)/1.1 var(--serif)}
.sgrid p{margin:0;color:var(--muted);font-size:.92rem;max-width:46ch}
.sgrid a:hover h3{color:var(--amber)}
.s-a{grid-column:span 7}.s-a img,.s-a .priv{aspect-ratio:4/3}
.s-b{grid-column:span 5;margin-top:90px}.s-b img,.s-b .priv{aspect-ratio:3/4}
.s-c{grid-column:span 4}.s-c img,.s-c .priv{aspect-ratio:4/5}
.s-d{grid-column:span 8}.s-d img,.s-d .priv{aspect-ratio:16/10}
.home-about{display:grid;grid-template-columns:1fr 1.2fr;gap:56px;padding:120px 28px;max-width:1100px;margin:0 auto;align-items:start}
.home-about figure img{aspect-ratio:4/5;object-fit:cover}
.home-about p{color:#4d4a44;max-width:52ch;margin:0 0 16px;font-size:17px}
.home-contact{padding:120px 28px 140px;text-align:center;border-top:1px solid var(--line)}
.home-contact h2{font:300 clamp(36px,6vw,72px)/1.05 var(--serif);letter-spacing:-.02em;margin:0 0 36px}
.home-contact a{display:inline-block;margin:6px 14px;font-size:17px;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px}
.home-contact a:hover{color:var(--amber);border-color:var(--amber)}
.js .reveal{opacity:0;transform:translateY(20px)}
@media(max-width:800px){.home-about{grid-template-columns:1fr}.s-a,.s-b,.s-c,.s-d{grid-column:1/-1;margin-top:0}}
@media(prefers-reduced-motion:reduce){.js .reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="nav">
  <a href="/">Pasha Calabasha</a>
  <nav><a href="/" class="n-series">Series</a><a href="/fotolibros">Fotolibros</a><a href="/cursos">Cursos</a><a href="/equipo">Equipo</a><a href="/familia">Familia</a><a href="/sobre" class="n-sobre">Sobre mí</a><a href="/contacto">Contacto</a></nav>
</header>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var n=document.querySelector('.nav'),c=document.querySelector('.cover');
  if(!c)return;
  function ver(){n.classList.toggle('top',scrollY<c.offsetHeight-n.offsetHeight)}
  ver();addEventListener('scroll',ver,{passive:true});addEventListener('resize',ver);
});
</script>

<main class="page">
<section class="serie" id="cascada">
  <div class="head"><h2>Cascada</h2><p>Niebla, roca volcánica y el ruido constante del agua. Coatepec, Veracruz.</p></div>
  <div class="stack">
    <div class="duo off">
      <figure><img src="img/5961.webp" width="1066" height="1600" loading="lazy" alt="Cascada entre la niebla y la selva"></figure>
      <figure><img src="img/5983.webp" width="1066" height="1600" loading="lazy" alt="Cascada vista desde abajo con el cañón cubierto de musgo"></figure>
    </div>
    <div class="solo"><figure><img src="img/5985.webp" width="1143" height="1600" loading="lazy" alt="Caída de agua blanca contra la pared del cañón"></figure></div>
    <figure class="full"><img src="img/5956.webp" width="1600" height="1066" loading="lazy" alt="Cascada que se abre entre la vegetación"></figure>
  </div>
</section>
<nav class="next" aria-label="Más series"><a class="sig" href="/selva"><span>Siguiente →</span>Selva</a></nav>
</main>

<footer>© 2026 Pasha Calabasha. Todas las fotografías son del autor.</footer>

<dialog id="lb" aria-label="Foto ampliada"><button type="button" aria-label="Cerrar">Cerrar</button><button type="button" class="lb-flecha lb-ant" aria-label="Foto anterior">&#8249;</button><img alt=""><button type="button" class="lb-flecha lb-sig" aria-label="Foto siguiente">&#8250;</button><p class="lb-pie"></p></dialog>
<script>
(function(){
  var d=document.getElementById('lb'),im=d.querySelector('img'),pie=d.querySelector('.lb-pie'),lista=[],n=0;
  function ver(){var f=lista[n];im.src=f.src;im.alt=f.alt;pie.textContent=f.getAttribute('data-pie')||''}
  /* la galería es todas las fotos de la página, en orden; también las de Familia, que llegan después */
  document.addEventListener('click',function(e){
    var f=e.target.closest&&e.target.closest('figure img');
    if(!f)return;
    lista=[].slice.call(document.querySelectorAll('figure img'));n=lista.indexOf(f);ver();d.showModal();
  });
  d.querySelector('.lb-ant').addEventListener('click',function(e){e.stopPropagation();n=(n-1+lista.length)%lista.length;ver()});
  d.querySelector('.lb-sig').addEventListener('click',function(e){e.stopPropagation();n=(n+1)%lista.length;ver()});
  d.addEventListener('click',function(e){if(e.target===d||e.target===im||e.target.tagName==='BUTTON'&&e.target.textContent==='Cerrar')d.close()});
  document.addEventListener('keydown',function(e){
    if(!d.open)return;
    if(e.key==='ArrowLeft')d.querySelector('.lb-ant').click();
    if(e.key==='ArrowRight')d.querySelector('.lb-sig').click();
  });
})();
</script>

</body>
</html>
