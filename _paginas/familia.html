<section class="serie" id="familia">
  <div class="head"><h2>Familia</h2><p>Esta serie es privada. Escribe la contraseña para verla.</p></div>
  <div class="lock" id="lock">
    <form id="lockform" autocomplete="off">
      <label for="pw" class="sr" style="position:absolute;left:-9999px">Contraseña</label>
      <input id="pw" type="password" placeholder="Contraseña" required>
      <button type="submit">Ver fotos</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </div>
  <div id="fam-grid"></div>
</section>
<script>
(function(){
  var f=document.getElementById('lockform'),err=document.getElementById('err'),grid=document.getElementById('fam-grid');
  var IT=310000;
  function u8(b){return new Uint8Array(b)}
  async function get(u){var r=await fetch(u);if(!r.ok)throw new Error('net');return u8(await r.arrayBuffer())}
  async function dec(g,buf){return crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},g,buf.slice(12))}
  f.addEventListener('submit',async function(e){
    e.preventDefault();err.textContent='';var b=f.querySelector('button');b.disabled=true;
    try{
      var salt=await get('privado/k');
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var man;
      try{man=JSON.parse(new TextDecoder().decode(await dec(key,await get('privado/m.enc'))))}
      catch(x){err.textContent='Contraseña incorrecta.';b.disabled=false;return}
      var items=await Promise.all(man.map(async function(m){
        var plain=await dec(key,await get('privado/'+m.f));
        return {u:URL.createObjectURL(new Blob([plain],{type:'image/jpeg'})),w:m.w,h:m.h}}));
      items.forEach(function(it){
        var fig=document.createElement('figure'),im=new Image();
        im.src=it.u;im.width=it.w;im.height=it.h;im.alt='Foto familiar';im.loading='lazy';
        fig.appendChild(im);fig.addEventListener('click',function(){var d=document.getElementById('lb');d.querySelector('img').src=it.u;d.querySelector('img').alt='Foto familiar';d.showModal()});
        grid.appendChild(fig)});
      document.getElementById('lock').style.display='none';
      document.querySelector('#familia .head p').textContent='Un fin de semana en Coatepec, con la gente que quiero.';
    }catch(x){err.textContent='No se pudieron cargar las fotos. Intenta de nuevo.';b.disabled=false}
  });
})();
</script>
